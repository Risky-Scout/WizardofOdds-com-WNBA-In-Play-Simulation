services:
  api:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    command: wizard-wnba-api
    env_file: /opt/wizard-wnba/.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/wizard-wnba/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 15s

  worker:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    command: wizard-wnba-worker --mode live
    env_file: /opt/wizard-wnba/.env
    volumes:
      - /opt/wizard-wnba/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    # Real health based on heartbeat freshness (reads /data volume).
    healthcheck:
      test: ["CMD", "wizard-wnba-worker", "--healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
