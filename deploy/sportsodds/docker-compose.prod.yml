services:
  api:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    command: wizard-wnba-api
    env_file: /opt/wizard-wnba/.env
    # sportsodds uses CSF with FORWARD DROP. Bridge-published ports via
    # docker-proxy fail there; host networking keeps the API on :8080 while
    # CSF still blocks external access to 8080 (not in TCP_IN).
    network_mode: host
    volumes:
      - /opt/wizard-wnba/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 15s

  worker:
    image: ${IMAGE_URI:?IMAGE_URI is required}
    command: wizard-wnba-worker --mode live
    env_file: /opt/wizard-wnba/.env
    network_mode: host
    volumes:
      - /opt/wizard-wnba/data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wizard-wnba-worker", "--healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
