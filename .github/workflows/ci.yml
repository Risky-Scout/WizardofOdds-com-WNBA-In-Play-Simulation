name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m compileall -q src
      - name: Build and smoke-test container
        if: matrix.python-version == '3.12'
        run: |
          docker build -t wizard-wnba:test .
          docker run -d --name wizard-wnba-api -p 18080:8080 \
            -e DATA_DIR=/tmp/data wizard-wnba:test
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          docker logs wizard-wnba-api
          exit 1
