name: Build production image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: [self-hosted, wizard-wnba]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Verify Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"
          docker version
          docker info >/dev/null
          docker buildx version

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Configure multi-platform builder
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"

          if docker buildx inspect wizard-wnba-builder >/dev/null 2>&1; then
            docker buildx use wizard-wnba-builder
          else
            docker buildx create \
              --name wizard-wnba-builder \
              --driver docker-container \
              --use
          fi

          docker buildx inspect --bootstrap

      - name: Build and push production image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Applications/Docker.app/Contents/Resources/bin:$PATH"

          REPOSITORY_LOWER="$(
            printf '%s' "$GITHUB_REPOSITORY" |
              tr '[:upper:]' '[:lower:]'
          )"

          IMAGE_ROOT="ghcr.io/${REPOSITORY_LOWER}"
          IMAGE_SHA="${IMAGE_ROOT}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_ROOT}:latest"

          echo "Building:"
          echo "$IMAGE_SHA"
          echo "$IMAGE_LATEST"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_LATEST" \
            --push \
            .

          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Record immutable image
        shell: bash
        run: |
          {
            echo "### Production image"
            echo
            echo '${{ steps.build.outputs.image_sha }}'
          } >> "$GITHUB_STEP_SUMMARY"
